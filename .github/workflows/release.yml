# Builds the Windows installer and portable zip, the macOS disk image and one Debian package per Linux
# distribution: Ubuntu 24.04, Ubuntu 26.04, Debian 12 and Debian 13. Each .deb is built in a
# container of its distribution, against that distribution's own Qt 6 packages.
#
# Everything follows the version of CMakeLists.txt (project VERSION):
# - Pushing the tag "v<version>" (e.g. v4.0.2) builds all the packages and creates a draft
#   GitHub release "Exam'1 <version>" with them. Its notes are made by tools/release_notes.py
#   from the "## <version>" section of CHANGELOG.md and packaging/release/notes.md.in.
#   Check the draft, then publish it.
#   The workflow stops at once if the tag does not match the version of CMakeLists.txt, or if
#   CHANGELOG.md has no section for that version.
# - "Run workflow" (Actions tab) builds the packages without creating a release; they can
#   be downloaded from the run page, e.g. to have the macOS build tried on a Mac first.
#
# macOS signing is optional. Without the secrets below, the application is signed ad hoc and
# macOS asks for confirmation on first launch. With an Apple Developer account, set:
#   MACOS_CERTIFICATE           Developer ID Application certificate (.p12), base64-encoded
#   MACOS_CERTIFICATE_PASSWORD  password of the .p12 file
#   MACOS_SIGN_IDENTITY         "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   notarization (app-specific password)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bundle_bank:
        description: Bundle the current question bank in the packages
        type: boolean
        default: true

permissions:
  contents: read

env:
  QT_VERSION: 6.8.3

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the version of CMakeLists.txt
        id: version
        run: |
          VERSION="$(sed -n 's/^ *VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)"
          if [ -z "$VERSION" ]; then
            echo "::error::No VERSION found in CMakeLists.txt"
            exit 1
          fi
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check the tag and CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $VERSION of CMakeLists.txt (expected tag v$VERSION)."
            exit 1
          fi
          python3 tools/release_notes.py --check

  bank:
    name: Question bank
    # Downloaded once from the REF server and shared by all the builds.
    needs: version
    if: github.event_name == 'push' || inputs.bundle_bank
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download the question bank
        run: bash packaging/fetch_bank.sh
      - uses: actions/upload-artifact@v7
        with:
          name: bank
          path: |
            packaging/data/questions.json
            packaging/data/series.json
            packaging/data/questions.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows:
    name: Windows installer
    needs: [version, bank]
    if: >-
      ${{ !cancelled() && needs.version.result == 'success'
          && (needs.bank.result == 'success' || needs.bank.result == 'skipped') }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: needs.bank.result == 'success'
        with:
          name: bank
          path: packaging/data
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build
        shell: cmd
        run: call packaging\windows\build_windows.bat "%QT_ROOT_DIR%"
      - uses: actions/upload-artifact@v7
        with:
          name: exam1-windows
          path: |
            build-win/Exam1-*-setup.exe
            build-win/Exam1_v*_Windows_portable.zip
          if-no-files-found: error

  linux:
    name: Linux package (${{ matrix.name }})
    needs: [version, bank]
    if: >-
      ${{ !cancelled() && needs.version.result == 'success'
          && (needs.bank.result == 'success' || needs.bank.result == 'skipped') }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      # One distribution failing does not stop the others.
      fail-fast: false
      matrix:
        include:
          - { name: Ubuntu 24.04, image: 'ubuntu:24.04', id: ubuntu24.04 }
          - { name: Ubuntu 26.04, image: 'ubuntu:26.04', id: ubuntu26.04 }
          - { name: Debian 12, image: 'debian:12', id: debian12 }
          - { name: Debian 13, image: 'debian:13', id: debian13 }
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: needs.bank.result == 'success'
        with:
          name: bank
          path: packaging/data
      - name: Build
        run: |
          bash packaging/linux/build_linux.sh --install-deps
          bash packaging/linux/make_deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: exam1-${{ matrix.id }}
          path: build/exam1_*.deb
          if-no-files-found: error

  macos:
    name: macOS disk image
    needs: [version, bank]
    if: >-
      ${{ !cancelled() && needs.version.result == 'success'
          && (needs.bank.result == 'success' || needs.bank.result == 'skipped') }}
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: needs.bank.result == 'success'
        with:
          name: bank
          path: packaging/data
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Import the signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
                           -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
      - name: Build
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/macos/build_macos.sh "$QT_ROOT_DIR"
      - uses: actions/upload-artifact@v7
        with:
          name: exam1-macos
          path: build-mac/Exam1-*.dmg
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: [version, bank, windows, linux, macos]
    # Windows and macOS are required; the Linux packages that were built are attached even if
    # one distribution failed (check the run before publishing the draft).
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.version.result == 'success'
          && needs.windows.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: exam1-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        if: needs.bank.result == 'success'
        with:
          name: bank
          path: bank
      - name: Write the release notes
        # "## <version>" of CHANGELOG.md + packaging/release/notes.md.in + bundled bank version.
        run: python3 tools/release_notes.py --bank bank -o "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v3
        with:
          name: Exam'1 ${{ needs.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          draft: true
          files: dist/*
          fail_on_unmatched_files: true
